name: Publishes a new package of Zebble.VideoPlayer to the nuget.org
on:
  push:
    branches: [ master ]
jobs:
 build:
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        configuration: [ Release ]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Install MAUI
      run: dotnet workload install ios android maui --source https://aka.ms/dotnet8/nuget/index.json --source https://api.nuget.org/v3/index.json

    - name: Install Zebble's CLI tools
      run: dotnet tool install --global zebble-build

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-1
      with:
        user: GeeksLtd

    - name: Publish a new Zebble.VideoPlayer package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-1.outputs.NUGET_API_KEY }} --publish